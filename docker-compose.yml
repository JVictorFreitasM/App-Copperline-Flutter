services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: copperline
    volumes:
      - copperline-postgres-data:/var/lib/postgresql/data
    # Exposto no host (backend/.env já aponta DATABASE_URL pra
    # localhost:5434) pra rodar `npx prisma migrate dev` direto da máquina
    # - sem isso não dá pra gerar/aplicar migration nova, só via container.
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # A imagem (Dockerfile) fixa NODE_ENV=production, o que liga
      # cookie.secure=true na sessao (ver src/main.ts) - correto quando ha
      # TLS de verdade na frente, mas essa stack local nao tem (tudo em
      # http://localhost simples). Com secure:true sobre http puro, o
      # navegador/curl recusa guardar o cookie e o login nunca completa
      # (state sempre "expira"). Sobrescrito aqui so pra esta verificacao
      # local - numa implantacao real atras de TLS, nao definir isso.
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/copperline?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_DOMAIN:
      # IDP_URL (servidor-a-servidor) usa host.docker.internal pra alcancar
      # o IdP rodando fora dessa stack, exposto na porta 3000 do host.
      # IDP_AUTHORIZE_URL/IDP_REDIRECT_URI (navegador) usam loopback local -
      # decisao deliberada enquanto so o web e' testado nesta maquina (sem
      # depender do IP da rede local, que muda com o DHCP). Se o app mobile
      # (OS-MOBILE-12) voltar a ser testado num celular fisico nesta rede,
      # isso PRECISA voltar a ser o IP da rede local (nao host.docker.internal
      # nem loopback - o celular enxerga "localhost"/"127.0.0.1" como o
      # proprio celular).
      # IDP_AUTHORIZE_URL usa 127.0.0.1 (nao "localhost") - nesta maquina,
      # um processo do Windows (DllHost.exe, alheio a este projeto) fica
      # escutando "localhost" (::1) na porta 3000 e trava qualquer
      # redirecionamento de reautenticacao (sessao expirada, 15min) que
      # passe por "http://localhost:3000/authorize". Sem esse problema de
      # SO, "localhost" funcionaria igual - mas 127.0.0.1 sempre bate no
      # container certo, entao fica como default mais robusto aqui.
      IDP_URL: http://host.docker.internal:3000
      # Testando no celular fisico agora (OS-MOBILE-21/24/25/26) - IP da
      # rede local (nao 127.0.0.1/localhost, que o celular enxergaria como
      # o proprio celular). Muda com o DHCP - se o IP da maquina mudar,
      # atualizar aqui E em systems.redirect_uris no IdP (ja tem um
      # historico de IPs antigos la, nao precisa remover, so garantir que o
      # atual esteja presente).
      IDP_AUTHORIZE_URL: http://192.168.2.49:3000
      IDP_CLIENT_ID: ${IDP_CLIENT_ID}
      IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET}
      # Cadastrado EXATAMENTE assim em systems.redirect_uris no IdP - nao
      # mudar sem tambem atualizar o cadastro la (match tem que ser exato,
      # ver skill idp-client).
      IDP_REDIRECT_URI: http://192.168.2.49:3010/auth/callback
      # Destino pos-login quando NAO ha' `returnTo` salvo (ver
      # idp-auth.module.ts) - acontece sempre que o login comeca direto por
      # um card no portal do IdP, em vez de GET /auth/login desta app. Sem
      # isso, o usuario cai no "/" do proprio BACKEND (404 cru) em vez do
      # site (frontend).
      FRONTEND_PUBLIC_URL: http://localhost:3020
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      WK_RADAR_API_URL: ${WK_RADAR_API_URL}
      WK_RADAR_EMPRESA: ${WK_RADAR_EMPRESA}
      WK_RADAR_USUARIO: ${WK_RADAR_USUARIO}
      WK_RADAR_SENHA: ${WK_RADAR_SENHA}
      WK_RADAR_ID_INTEGRADOR: ${WK_RADAR_ID_INTEGRADOR}
      WK_RADAR_REQUEST_TIMEOUT_MS: 30000
      WK_RADAR_JANELA_CLIENTE_MS: 86400000
      WK_RADAR_JANELA_PRODUTO_MS: 21600000
      WK_RADAR_MIN_REQUEST_INTERVAL_MS: 300
      WK_RADAR_JANELA_PEDIDO_MS: 7200000
      WK_RADAR_JANELA_NOTA_FISCAL_MS: 86400000
      WK_RADAR_CLIENTE_DATA_INICIO_CARGA: ${WK_RADAR_CLIENTE_DATA_INICIO_CARGA}
      WK_RADAR_PRODUTO_DATA_INICIO_CARGA: ${WK_RADAR_PRODUTO_DATA_INICIO_CARGA}
      WK_RADAR_PEDIDO_DATA_INICIO_CARGA: ${WK_RADAR_PEDIDO_DATA_INICIO_CARGA}
      WK_RADAR_SALDO_ESTOQUE_DATA_INICIO_CARGA: ${WK_RADAR_SALDO_ESTOQUE_DATA_INICIO_CARGA}
      WK_RADAR_VENDEDOR_DATA_INICIO_CARGA: ${WK_RADAR_VENDEDOR_DATA_INICIO_CARGA}
      WK_RADAR_NOTA_FISCAL_DATA_INICIO_CARGA: ${WK_RADAR_NOTA_FISCAL_DATA_INICIO_CARGA}
      WK_BI_URL: ${WK_BI_URL}
      WK_BI_BASE: ${WK_BI_BASE}
      WK_BI_USUARIO: ${WK_BI_USUARIO}
      WK_BI_SENHA: ${WK_BI_SENHA}
      WK_BI_HASH_SALDO_ESTOQUE: ${WK_BI_HASH_SALDO_ESTOQUE}
      WK_BI_REQUEST_TIMEOUT_MS: ${WK_BI_REQUEST_TIMEOUT_MS}
      # Estoque.svc (SOAP/WCF) - sincronizacao periodica de saldo de
      # estoque, reaproveita as credenciais WK_BI_* acima.
      WK_RADAR_ESTOQUE_SVC_URL: ${WK_RADAR_ESTOQUE_SVC_URL}
      # Financeiro.svc (OS-BACKEND-36, revisao) - mesmo padrao do
      # Estoque.svc acima, reaproveita as credenciais WK_BI_*.
      WK_RADAR_FINANCEIRO_SVC_URL: ${WK_RADAR_FINANCEIRO_SVC_URL}
      # Firebase Cloud Messaging - vazio ate ser configurado (fail-closed
      # so no envio, nao no boot - ver PushNotificationClientService).
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      # Fotos de check-in de visita (extensao pos-OS-BACKEND-28) - disco
      # local, decisao confirmada com o usuario. Volume nomeado abaixo pra
      # sobreviver a recriacao do container (docker compose up -d
      # backend), senao a foto some a cada deploy.
      VISITAS_FOTOS_DIR: /workspace/backend/uploads/visitas
      # Documentos institucionais (OS-BACKEND-41) - mesmo padrao de disco
      # local + volume persistente ja usado acima pra fotos de visita.
      DOCUMENTOS_DIR: /workspace/backend/uploads/documentos
    ports:
      - "3010:3000"
    volumes:
      - copperline-visitas-fotos:/workspace/backend/uploads/visitas
      - copperline-documentos:/workspace/backend/uploads/documentos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    environment:
      # Hostname interno do compose - chamadas servidor-a-servidor do
      # Next.js pro NestJS nao passam pelo host.
      API_URL: http://backend:3000
      # O que o NAVEGADOR do usuario efetivamente acessa (login/logout) -
      # PRECISA bater com a mesma origem usada em IDP_REDIRECT_URI do
      # backend (ver acima) - se forem origens diferentes (ex: localhost
      # aqui vs IP da rede la), o cookie de sessao criado no /auth/login
      # nao e enviado de volta no /auth/callback (cookie e por origem,
      # nao so por porta/caminho), e a validacao de "state" (CSRF) sempre
      # falha com "Login expirado". Testando no celular fisico agora -
      # IP da rede local, mesmo motivo/valor do IDP_REDIRECT_URI.
      API_PUBLIC_URL: http://192.168.2.49:3010
      # Mesma chave do backend (ver ApiKeyGuard) - a Central de
      # Sincronizacao (OS-WEB-18) chama admin/sync/* server-side
      # (lib/admin-api.ts), nunca exposta ao navegador.
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "3020:3000"
    depends_on:
      - backend

volumes:
  copperline-postgres-data:
  copperline-visitas-fotos:
  copperline-documentos:
